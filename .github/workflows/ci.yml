name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: uvx pluvy --all
      - run: bun test
      - run: bun run typecheck
