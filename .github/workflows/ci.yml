name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: uvx pluvy --all
        if: ${{ !cancelled() }}
      - run: bun test
        if: ${{ !cancelled() }}
      - run: bun run typecheck
        if: ${{ !cancelled() }}
