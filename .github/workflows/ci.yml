name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile
      - run: bun test
        if: ${{ !cancelled() }}
      - run: bun run typecheck
        if: ${{ !cancelled() }}
      - run: uvx pluvy --all
        if: ${{ !cancelled() }}

  publish:
    runs-on: ubuntu-latest
    needs: [checks]
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
      - name: Show Node and npm versions
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
      - name: Verify package version matches release tag
        if: ${{ github.event_name == 'release' }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "::error::package.json version '$package_version' does not match release tag '$GITHUB_REF_NAME'"
            exit 1
          fi
          echo "Version check passed: package.json '$package_version' matches release tag '$GITHUB_REF_NAME'." >> "$GITHUB_STEP_SUMMARY"
      - name: Warn when NPM_TOKEN is missing for dry run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN is not configured; the dry-run staging step does not need authentication, but a real release will fail without it."
          fi
      - name: Stage package for publishing
        if: ${{ github.event_name == 'release' }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm stage publish ./ 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Dry-run staging
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          npm stage publish ./ --dry-run 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: List staged versions
        # Staging already succeeded; listing is verification only, so a list failure must not fail the job.
        continue-on-error: true
        if: ${{ github.event_name == 'release' }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm stage list opencode-venice-auth 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
